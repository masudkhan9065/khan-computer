<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>খান কম্পিউটার - দোকান হিসাব</title>
<style>
*{box-sizing:border-box;font-family:Hind Siliguri,Arial,sans-serif}
body{margin:0;background:#f1f5f9;color:#111}
header{background:#0f172a;color:#fff;padding:14px;text-align:center;position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:22px} header p{margin:2px 0 0;font-size:13px;opacity:.8}
.top{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px}
.card{background:#fff;border-radius:12px;padding:12px;text-align:center;box-shadow:0 2px 8px #0001}
.card b{font-size:20px;display:block} .green{color:#16a34a}.red{color:#dc2626}.orange{color:#ea580c}
.tabs{display:flex;gap:6px;padding:0 10px;overflow:auto}
.tabs button{flex:1;white-space:nowrap;padding:10px;border:0;border-radius:10px;background:#e2e8f0;font-weight:700;cursor:pointer}
.tabs button.active{background:#0f172a;color:#fff}
.wrap{padding:10px}
.box{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px #0001}
h3{margin:0 0 10px} input,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;margin-bottom:8px;font-size:15px}
.btn{width:100%;padding:12px;border:0;border-radius:10px;background:#16a34a;color:#fff;font-weight:700;font-size:16px;cursor:pointer}
.btn2{background:#0f172a}.btn3{background:#dc2626}.btn4{background:#f59e0b}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{border:1px solid #e2e8f0;border-radius:12px;padding:10px;text-align:center;background:#fff}
.item b{display:block;font-size:16px}.item span{color:#666;font-size:13px}
.item button{margin-top:8px;width:100%;padding:9px;border:0;border-radius:8px;background:#0f172a;color:#fff;font-weight:700}
.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed #e2e8f0;font-size:14px}
.small{font-size:12px;color:#666} .flex{display:flex;gap:6px}
.flex button{flex:1;padding:9px;border:0;border-radius:8px;color:#fff;font-weight:700}
.hide{display:none}
</style>
</head>
<body>
<header><h1>🏪 খান কম্পিউটার & স্টেশনারি</h1><p>বিক্রি • বাকি • আয়-ব্যয় হিসাব</p></header>

<div class="top">
<div class="card">আজ বিক্রি<b class="green" id="todaySale">০৳</b></div>
<div class="card">মোট বাকি<b class="orange" id="totalBaki">০৳</b></div>
<div class="card">আজ খরচ<b class="red" id="todayExp">০৳</b></div>
</div>

<div class="tabs">
<button onclick="show('sell',this)" class="active">🛒 বিক্রি</button>
<button onclick="show('baki',this)">� دفتر বাকি</button>
<button onclick="show('stock',this)">📦 মাল / স্টক</button>
<button onclick="show('hisab',this)">💰 আয়-ব্যয়</button>
</div>

<div class="wrap">
<!-- SELL -->
<div id="sell">
<div class="box">
<input id="custName" placeholder="ক্রেতার নাম (না দিলেও হবে)">
<select id="payType"><option value="cash">💵 নগদ বিক্রি</option><option value="baki">� دفتر বাকি বিক্রি</option></select>
</div>
<div class="grid" id="productGrid"></div>
<div class="box"><h3>🧾 আজকের বিক্রি</h3><div id="saleList"></div></div>
</div>

<!-- BAKI -->
<div id="baki" class="hide">
<div class="box"><h3>➕ নতুন বাকি যোগ</h3>
<input id="bakiName" placeholder="নাম লিখুন - যেমন: রহিম">
<input id="bakiAmt" type="number" placeholder="টাকার পরিমাণ">
<input id="bakiNote" placeholder="কি নিলো? যেমন: ২টা খাতা">
<button class="btn btn2" onclick="addBaki()">বাকি যোগ করুন</button></div>
<div class="box"><h3>📋 বাকির খাতা</h3><div id="bakiList"></div></div>
</div>

<!-- STOCK -->
<div id="stock" class="hide">
<div class="box"><h3>➕ নতুন মাল যোগ</h3>
<input id="newName" placeholder="মালের নাম - যেমন: রাবার">
<input id="newPrice" type="number" placeholder="দাম - যেমন: ২০">
<button class="btn" onclick="addProduct()">মাল যোগ করুন</button></div>
<div class="box"><h3>📦 দোকানের মাল</h3><div id="stockList"></div></div>
</div>

<!-- HISAB -->
<div id="hisab" class="hide">
<div class="box"><h3>➕ খরচ যোগ</h3>
<input id="expNote" placeholder="কিসে খরচ? যেমন: কাগজ কিনলাম">
<input id="expAmt" type="number" placeholder="টাকা">
<button class="btn btn3" onclick="addExp()">খরচ যোগ করুন</button></div>
<div class="box"><h3>📊 সব হিসাব</h3><div id="allHisab"></div>
<button class="btn btn4" style="margin-top:10px" onclick="if(confirm('সব মুছে ফেলবেন?')){localStorage.clear();location.reload()}">সব হিসাব মুছুন</button></div>
</div>
</div>

<script>
let products = JSON.parse(localStorage.getItem('khan_products')||'null') || [
{name:'ফটোকপি (১ পেজ)',price:5},{name:'ছবি (পাসপোর্ট)',price:80},{name:'ছবি (স্ট্যাম্প)',price:60},
{name:'কাগজ (A4)',price:2},{name:'স্টাম্প',price:50},{name:'কলম',price:10},
{name:'খাতা',price:45},{name:'পেনসিল',price:10},{name:'রাবার',price:10},
{name:'স্কেল',price:20},{name:'জুতা',price:450},{name:'স্যান্ডেল',price:250},
{name:'ফাইল',price:25},{name:'খাম',price:5},{name:'ক্যালকুলেটর',price:350}
];
let sales = JSON.parse(localStorage.getItem('khan_sales')||'[]');
let bakis = JSON.parse(localStorage.getItem('khan_baki')||'[]');
let exps = JSON.parse(localStorage.getItem('khan_exp')||'[]');
function save(){localStorage.setItem('khan_products',JSON.stringify(products));localStorage.setItem('khan_sales',JSON.stringify(sales));localStorage.setItem('khan_baki',JSON.stringify(bakis));localStorage.setItem('khan_exp',JSON.stringify(exps));render();}
function show(id,btn){document.querySelectorAll('.wrap > div').forEach(d=>d.classList.add('hide'));document.getElementById(id).classList.remove('hide');document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
function today(){return new Date().toISOString().slice(0,10)}
function render(){
let g=document.getElementById('productGrid');g.innerHTML='';
products.forEach((p,i)=>{
g.innerHTML+=`<div class="item"><b>${p.name}</b><span>${p.price}৳</span><button onclick="sell(${i})">বিক্রি +</button></div>`
});
let ts=sales.filter(s=>s.date==today()).reduce((a,b)=>a+b.price,0);
let te=exps.filter(s=>s.date==today()).reduce((a,b)=>a+b.amt,0);
let tb=bakis.reduce((a,b)=>a+b.amt,0);
document.getElementById('todaySale').innerText=ts+'৳';
document.getElementById('todayExp').innerText=te+'৳';
document.getElementById('totalBaki').innerText=tb+'৳';
document.getElementById('saleList').innerHTML = sales.slice().reverse().slice(0,20).map(s=>`<div class="row"><span>${s.name} <br><span class="small">${s.cust||'ক্রেতা'} • ${s.type=='baki'?'বাকি':'নগদ'}</span></span><b>${s.price}৳</b></div>`).join('')||'এখনো বিক্রি নাই';
document.getElementById('bakiList').innerHTML = bakis.map((b,i)=>`<div class="row"><span><b>${b.name}</b><br><span class="small">${b.note||''} • ${b.date}</span></span><span><b>${b.amt}৳</b><br><button onclick="paidBaki(${i})" style="background:#16a34a;color:#fff;border:0;padding:5px 10px;border-radius:6px;margin-top:4px">টাকা পাইছি</button></span></div>`).join('')||'কোনো বাকি নাই';
document.getElementById('stockList').innerHTML = products.map((p,i)=>`<div class="row"><span>${p.name}</span><b>${p.price}৳ <button onclick="delP(${i})" style="background:#dc2626;color:#fff;border:0;padding:4px 8px;border-radius:6px">✕</button></b></div>`).join('');
document.getElementById('allHisab').innerHTML = `<div class="row"><span>মোট বিক্রি</span><b>${sales.reduce((a,b)=>a+b.price,0)}৳</b></div><div class="row"><span>মোট বাকি</span><b>${tb}৳</b></div><div class="row"><span>মোট খরচ</span><b>${exps.reduce((a,b)=>a+b.amt,0)}৳</b></div>` + exps.slice().reverse().map(e=>`<div class="row"><span>${e.note}<br><span class="small">${e.date}</span></span><b class="red">-${e.amt}৳</b></div>`).join('');
}
function sell(i){
let p=products[i];let cust=document.getElementById('custName').value;let type=document.getElementById('payType').value;
sales.push({name:p.name,price:p.price,cust:cust,type:type,date:today()});
if(type=='baki'){bakis.push({name:cust||'নাম নাই',amt:p.price,note:p.name,date:today()});alert(p.name+' বাকিতে লেখা হইছে');}
else alert(p.name+' বিক্রি হইছে - '+p.price+'৳');
save();
}
function addBaki(){let n=document.getElementById('bakiName').value;let a=+document.getElementById('bakiAmt').value;let note=document.getElementById('bakiNote').value;if(!n||!a)return alert('নাম আর টাকা দেন');bakis.push({name:n,amt:a,note:note,date:today()});save();}
function paidBaki(i){bakis.splice(i,1);save();alert('বাকি শোধ হইছে');}
function addProduct(){let n=document.getElementById('newName').value;let pr=+document.getElementById('newPrice').value;if(!n||!pr)return alert('নাম আর দাম দেন');products.push({name:n,price:pr});save();}
function delP(i){products.splice(i,1);save();}
function addExp(){let n=document.getElementById('expNote').value;let a=+document.getElementById('expAmt').value;if(!n||!a)return alert('লিখেন');exps.push({note:n,amt:a,date:today()});save();}
render();
</script>
</body>
</html>
